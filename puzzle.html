<title>4×4 圖片拼接遊戲</title>
  <style>
    #puzzle {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 2px;
      width: 408px;
      border: 2px solid #333;
    }

    .game-area {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .reference {
      width: 228px;
    }

    .reference h3 {
      margin: 0 0 10px;
      text-align: center;
    }

    .reference img {
      display: block;
      width: 220px;
      height: 220px;
      object-fit: cover;
      border: 2px solid #333;
    }

    @media (max-width: 900px) {
      .game-area {
        flex-direction: column;
        align-items: center;
      }
    }

    .piece {
      width: 100px;
      height: 100px;
      background-image: url('images/p1.jpg');
      /* 換成你的圖片檔名 */
      background-size: 400px 400px;
      cursor: grab;
    }

    .dragging {
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <h2 style="text-align:center;">4×4 拼圖遊戲</h2>
  <div class="game-area">
    <section class="reference" aria-label="原圖參考">
      <h3>原圖</h3>
      <img src="images/p1.jpg" alt="拼圖原圖參考">
    </section>
    <section aria-label="拼圖遊戲">
      <h3 style="text-align:center; margin: 0 0 10px;">拼圖</h3>
      <div id="puzzle"></div>
    </section>
  </div>

  <script>
    const puzzle = document.getElementById("puzzle");
    let positions = [];
    const correctPositions = [];

    // 建立拼圖塊
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        const piece = document.createElement("div");
        piece.className = "piece";
        const pos = `-${col * 100}px -${row * 100}px`;
        piece.style.backgroundPosition = pos;
        piece.dataset.pos = pos;
        piece.draggable = true;
        positions.push(piece);
        correctPositions.push(pos);
      }
    }

    // 打亂拼圖
    positions.sort(() => Math.random() - 0.5);
    positions.forEach(p => puzzle.appendChild(p));

    // 拖曳交換邏輯
    let dragged = null;

    puzzle.addEventListener("dragstart", e => {
      if (e.target.classList.contains("piece")) {
        dragged = e.target;
        e.target.classList.add("dragging");
      }
    });

    puzzle.addEventListener("dragend", e => {
      e.target.classList.remove("dragging");
    });

    puzzle.addEventListener("dragover", e => e.preventDefault());

    puzzle.addEventListener("drop", e => {
      if (e.target.classList.contains("piece") && dragged) {
        let temp = dragged.style.backgroundPosition;
        dragged.style.backgroundPosition = e.target.style.backgroundPosition;
        e.target.style.backgroundPosition = temp;
        dragged = null;
        checkCompletion();
      }
    });

    // 檢查是否完成
    function checkCompletion() {
      const pieces = document.querySelectorAll(".piece");
      const currentPositions = Array.from(pieces).map(p => p.style.backgroundPosition);
      const isComplete = currentPositions.every((pos, i) => pos === correctPositions[i]);
      if (isComplete) {
        setTimeout(() => alert("🎉 恭喜完成！"), 200);
      }
    }
  </script>

  <script src="assets/script.js"></script>



</body>
