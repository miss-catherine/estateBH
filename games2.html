   <div class="container">

        <h1>🎯 猜數字遊戲</h1>

        <p>請猜一個 <strong>1 到 100</strong> 之間的數字。</p>

        <input type="number" id="guess" min="1" max="100" placeholder="輸入數字">

        <button onclick="checkGuess()">猜看看</button>

        <p id="message"></p>

        <p>
            猜測次數：
            <span id="attempts">0</span>
        </p>

        <button onclick="restartGame()">重新開始</button>

        <div class="responsible">
            💡 適度遊戲有益思考與學習，請注意休息並避免長時間使用螢幕。
        </div>

    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {

            const guess = Number(document.getElementById("guess").value);
            const message = document.getElementById("message");

            if (isNaN(guess) || guess < 1 || guess > 100) {
                message.textContent = "⚠️ 請輸入 1～100 之間的數字！";
                message.style.color = "red";
                return;
            }

            attempts++;
            document.getElementById("attempts").textContent = attempts;

            if (guess === secretNumber) {
                message.textContent =
                    `🎉 恭喜答對！你用了 ${attempts} 次猜中答案！`;
                message.style.color = "green";
            }
            else if (guess < secretNumber) {
                message.textContent = "📈 太小了，再試一次！";
                message.style.color = "orange";
            }
            else {
                message.textContent = "📉 太大了，再試一次！";
                message.style.color = "orange";
            }
        }

        function restartGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;

            document.getElementById("attempts").textContent = "0";
            document.getElementById("message").textContent = "";
            document.getElementById("guess").value = "";
        }
    </script>
